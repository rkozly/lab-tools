[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devreader"
version = "1.0.0"
description = "ADB device discovery, preparation and configuration management tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3"]

[project.gui-scripts]
devreader = "devreader.app:main"

[tool.setuptools.packages.find]
include = ["devreader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
